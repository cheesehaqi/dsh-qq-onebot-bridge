<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小鲸鱼控制台</title>
<style>
  :root { --bg:#0f1720; --panel:#17222e; --line:#243447; --fg:#e6edf3; --dim:#8aa0b4; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#4a9eff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .spacer { flex:1; }
  .pill { padding:2px 10px; border-radius:999px; font-size:12px; border:1px solid var(--line); color:var(--dim); }
  .pill.on { color:#0d1117; background:var(--ok); border-color:var(--ok); }
  .pill.off { color:var(--bad); border-color:var(--bad); }
  main { padding:16px 18px 40px; display:grid; gap:16px; grid-template-columns: minmax(320px,1fr) minmax(360px,1.2fr); align-items:start; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:13px; margin:0 0 10px; color:var(--dim); font-weight:600; letter-spacing:.5px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--bad); }
  .dot.on { background:var(--ok); }
  .dot.warn { background:var(--warn); }
  button { background:#22303f; color:var(--fg); border:1px solid var(--line); border-radius:7px; padding:7px 11px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#06121f; font-weight:600; }
  button.danger { border-color:#5c2b2b; color:#ffb4ae; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  pre { margin:0; padding:10px; background:#0b131b; border:1px solid var(--line); border-radius:8px; max-height:340px; overflow:auto; font-size:12px; line-height:1.45; white-space:pre-wrap; word-break:break-all; }
  .meta { color:var(--dim); font-size:12px; }
  .warnbox { border-color:#5a4620; background:#241d0f; color:#f0d08a; }
  a { color:var(--accent); }
  input { background:#0b131b; border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:6px 8px; width:100%; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .toast { position:fixed; right:16px; bottom:16px; background:#1d2a38; border:1px solid var(--line); padding:10px 14px; border-radius:8px; max-width:50ch; opacity:0; transition:.2s; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>🐋 小鲸鱼控制台</h1>
  <span id="botPill" class="pill">机器人：未知</span>
  <span id="hostPill" class="pill">宿主：未知</span>
  <span class="spacer"></span>
  <span class="meta" id="stamp"></span>
  <button onclick="refresh()">刷新</button>
</header>

<main>
  <section class="card">
    <h2>端口 / 进程</h2>
    <table>
      <thead><tr><th>端口</th><th>用途</th><th>状态</th><th>PID / 进程</th><th></th></tr></thead>
      <tbody id="ports"></tbody>
    </table>
    <div class="meta" id="procMeta" style="margin-top:10px"></div>
  </section>

  <section class="card">
    <h2>操作</h2>
    <div class="row">
      <button class="primary" onclick="act('/api/host/start')">启动宿主</button>
      <button onclick="act('/api/host/restart')">重启宿主</button>
      <button class="danger" onclick="act('/api/host/stop')">停止宿主</button>
    </div>
    <div class="row">
      <button onclick="act('/api/napcat/start')">启动 NapCat</button>
      <button class="danger" id="napcatStopBtn" onclick="act('/api/napcat/stop')">停止 NapCat（含其 QQ 子进程）</button>
      <button onclick="act('/api/tts/start')">启动 GPT-SoVITS</button>
      <button class="danger" onclick="act('/api/tts/stop')">停止 GPT-SoVITS</button>
    </div>
    <div class="row">
      <button class="danger" onclick="act('/api/all/stop')">全部停止</button>
      <a id="hostLink" href="#" target="_blank" style="display:none"><button>打开机器人控制台（3080）</button></a>
      <a id="napcatLink" href="#" target="_blank"><button>打开 NapCat 扫码页</button></a>
    </div>
    <div class="grid2" style="margin-top:12px">
      <label class="meta">宿主工作目录<input id="cfgCwd" /></label>
      <label class="meta">dsh bin.js 路径<input id="cfgDshBin" /></label>
      <label class="meta">NapCat 启动脚本<input id="cfgNapcatBat" /></label>
      <label class="meta">GPT-SoVITS 启动脚本<input id="cfgTtsBat" /></label>
    </div>
    <div class="row" style="margin-top:10px">
      <button onclick="saveConfig()">保存路径配置</button>
      <span class="meta">端口改动请直接编辑 qq-control.json（避免误改 6700）</span>
    </div>
  </section>

  <section class="card" style="grid-column:1/-1">
    <h2>日志</h2>
    <div class="row">
      <button onclick="setLog('hostOut')">宿主 stdout</button>
      <button onclick="setLog('hostErr')">宿主 stderr</button>
      <button onclick="setLog('bridge')">桥调试日志</button>
      <span class="spacer"></span>
      <label class="meta"><input type="checkbox" id="follow" checked /> 自动跟随</label>
    </div>
    <pre id="log">（选择一份日志）</pre>
  </section>

  <section class="card warnbox" id="warnCard" style="grid-column:1/-1; display:none">
    <h2>配置提醒</h2>
    <div id="warns"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const token = new URLSearchParams(location.search).get('token') || '';
let currentLog = 'hostOut';

function api(path, options = {}) {
  const url = path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token);
  return fetch(url, { ...options, headers: { 'X-Control-Token': token, ...(options.headers || {}) } }).then((r) => r.json());
}
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 4000);
}
async function act(path) {
  if (path.endsWith('/stop') || path.endsWith('/free')) {
    const labels = { '/api/host/stop': '停止宿主', '/api/napcat/stop': '停止 NapCat/QQ', '/api/tts/stop': '停止 GPT-SoVITS', '/api/all/stop': '全部停止' };
    if (!confirm((labels[path] || '执行') + '？')) return;
  }
  const result = await api(path, { method: 'POST', body: JSON.stringify({}) });
  toast((result.ok === false ? '⚠️ ' : '✅ ') + (result.reason || '完成'));
  setTimeout(refresh, 1200);
}
function freePort(name) {
  if (!confirm('结束占用该端口的进程？')) return;
  api('/api/port/free', { method: 'POST', body: JSON.stringify({ name }) }).then((r) => { toast((r.ok ? '✅ ' : '⚠️ ') + r.reason); setTimeout(refresh, 1200); });
}
function setLog(name) { currentLog = name; loadLog(true); }
async function loadLog(force) {
  if (!force && !document.getElementById('follow').checked) return;
  const result = await api('/api/logs?name=' + currentLog + '&lines=200');
  const el = document.getElementById('log');
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
  el.textContent = (result.lines || []).join('\n') || '（空）';
  if (atBottom) el.scrollTop = el.scrollHeight;
}
function render(status) {
  const tbody = document.getElementById('ports');
  tbody.innerHTML = '';
  for (const item of status.ports || []) {
    const tr = document.createElement('tr');
    const state = item.listening
      ? `<span class="dot on"></span>监听${item.established ? `（${item.established} 条连接）` : ''}`
      : '<span class="dot"></span>未监听';
    tr.innerHTML = `<td>${item.port}</td><td>${item.label}</td><td>${state}</td><td class="meta">${item.pid || '-'} ${item.process || ''}</td>`;
    const td = document.createElement('td');
    if (item.listening && item.name !== 'control') {
      const btn = document.createElement('button');
      btn.textContent = '释放';
      btn.className = 'danger';
      btn.onclick = () => freePort(item.name);
      td.appendChild(btn);
    }
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
  const host = (status.ports || []).find((p) => p.name === 'host');
  const hostPill = document.getElementById('hostPill');
  hostPill.textContent = '宿主：' + (host?.listening ? '运行中' : '未运行');
  hostPill.className = 'pill ' + (host?.listening ? 'on' : 'off');
  const botPill = document.getElementById('botPill');
  botPill.textContent = '机器人：' + (status.botOnline ? '在线' : '离线');
  botPill.className = 'pill ' + (status.botOnline ? 'on' : 'off');
  const napcat = status.processes?.napcatLoaders || [];
  const qqClients = status.processes?.qqClients || [];
  const tts = status.processes?.tts || [];
  const qr = status.qr || {};
  const managed = status.processes?.napcatManaged === true;
  document.getElementById('procMeta').innerHTML =
    `NapCat 加载器：${napcat.length ? napcat.map((p) => `${p.name}#${p.pid}`).join('、') : '未运行'}｜` +
    `个人 QQ 客户端：${qqClients.length} 个${managed ? '（受 NapCat 管理）' : '（<b>不受管，控制台不会结束它们</b>）'}｜` +
    `Python 进程：${tts.length}｜` +
    `扫码图：${qr.exists ? (qr.fresh ? `新鲜（${qr.ageSeconds}s 前）` : `较旧（${Math.round(qr.ageSeconds / 60)} 分钟前）`) : '未生成'}`;
  const napcatStop = document.getElementById('napcatStopBtn');
  napcatStop.disabled = !managed;
  napcatStop.title = managed ? '结束 NapCat 加载器（taskkill /T 会连带其 QQ 子进程）' : '未检测到 NapCat，按钮已禁用以免误杀个人 QQ';
  const hostLink = document.getElementById('hostLink');
  if (status.hostUrl) { hostLink.href = status.hostUrl; hostLink.style.display = ''; }
  else hostLink.style.display = 'none';
  document.getElementById('napcatLink').href = 'http://127.0.0.1:' + ((status.config?.ports?.napcat) || 6099);
  document.getElementById('stamp').textContent = '刷新于 ' + new Date(status.scannedAt || Date.now()).toLocaleTimeString('zh-CN', { hour12: false });
  const warnings = status.warnings || [];
  document.getElementById('warnCard').style.display = warnings.length ? '' : 'none';
  document.getElementById('warns').innerHTML = warnings.map((w) => '· ' + w).join('<br>');
  const cfg = status.config || {};
  if (document.activeElement?.tagName !== 'INPUT') {
    document.getElementById('cfgCwd').value = cfg.cwd || '';
    document.getElementById('cfgDshBin').value = cfg.dshBin || '';
    document.getElementById('cfgNapcatBat').value = cfg.napcatBat || '';
    document.getElementById('cfgTtsBat').value = cfg.ttsBat || '';
  }
}
async function saveConfig() {
  const result = await api('/api/config', { method: 'POST', body: JSON.stringify({
    cwd: document.getElementById('cfgCwd').value,
    dshBin: document.getElementById('cfgDshBin').value,
    napcatBat: document.getElementById('cfgNapcatBat').value,
    ttsBat: document.getElementById('cfgTtsBat').value,
  }) });
  toast((result.ok ? '✅ ' : '⚠️ ') + result.reason);
}
async function refresh() {
  try { render(await api('/api/status')); } catch (e) { toast('status 失败：' + e.message); }
}
refresh();
loadLog(true);
setInterval(refresh, 4000);
setInterval(() => loadLog(false), 3000);
</script>
</body>
</html>
